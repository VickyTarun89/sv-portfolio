    <!-- LinkedIn Parameter Shield: Clean tracking params before Router loads -->
    <script>
      (function() {
        const url = new URL(window.location.href);
        const params = ['trk', 'li_fat_id', 'fbclid'];
        let changed = false;
        params.forEach(p => {
          if (url.searchParams.has(p)) {
            url.searchParams.delete(p);
            changed = true;
          }
        });
        if (changed) {
          window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
        }
      })();
    </script>
